# Sends the queued ticket emails (Firestore notificationJobs, channel EMAIL).
# This replaces Cloud Functions for email while the Firebase project is on the free Spark plan.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  the whole service-account JSON of the Firebase project
#   Gmail, free and no domain needed (used when both are set):
#     GMAIL_USER              the Gmail address that sends the tickets
#     GMAIL_APP_PASSWORD      its App Password (Google account -> Security -> App passwords)
#     EMAIL_FROM_NAME         optional sender name, default "Scientific Club"
#   or Resend (needs a verified domain):
#     RESEND_API_KEY, EMAIL_FROM (e.g. Scientific Club <tickets@your-domain.org>)
#   FIREBASE_PROJECT_ID       optional: read from the service-account file when not set
#
# GitHub may start scheduled runs a few minutes late. The ticket is always shown on screen
# right after registering; the email is the copy.
name: Send ticket emails

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: send-emails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Names only, never values. FIREBASE_PROJECT_ID and EMAIL_FROM may be variables or secrets.
      - name: Check the settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || secrets.EMAIL_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
        run: |
          missing=0
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing"; missing=1; }
          if [ -n "$GMAIL_USER" ] || [ -n "$GMAIL_APP_PASSWORD" ]; then
            [ -n "$GMAIL_USER" ] || { echo "::error::Secret GMAIL_USER is missing"; missing=1; }
            [ -n "$GMAIL_APP_PASSWORD" ] || { echo "::error::Secret GMAIL_APP_PASSWORD is missing"; missing=1; }
          else
            [ -n "$RESEND_API_KEY" ] || { echo "::error::Add GMAIL_USER + GMAIL_APP_PASSWORD (free), or RESEND_API_KEY"; missing=1; }
            [ -n "$EMAIL_FROM" ] || { echo "::error::EMAIL_FROM is missing (needed with Resend)"; missing=1; }
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(j.type!=="service_account"||!j.private_key)throw 0}catch{console.log("::error::FIREBASE_SERVICE_ACCOUNT is not the service-account JSON file (paste the whole file)");process.exit(1)}})' || missing=1
          fi
          exit $missing

      - name: Send queued emails
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || secrets.EMAIL_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          # The project id is in the service-account file; FIREBASE_PROJECT_ID only overrides it.
          if [ -z "$GCLOUD_PROJECT" ]; then
            GCLOUD_PROJECT=$(node -e 'console.log(require(process.argv[1]).project_id)' "$RUNNER_TEMP/service-account.json")
            export GCLOUD_PROJECT
          fi
          echo "Firebase project: $GCLOUD_PROJECT"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json" npm run send-emails
          rm -f "$RUNNER_TEMP/service-account.json"
